<!doctype html>
<html lang="fr" class="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Planning Padel</title>
  <meta name="description" content="Suivi de mes tournois et parties ouvertes de padel" />
  <meta name="theme-color" content="#09090b" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icon.svg" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Padel" />

  <script src="https://cdn.tailwindcss.com/3.4.16"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'system-ui', '-apple-system', 'Segoe UI', 'Roboto', 'sans-serif'] },
          colors: { ball: { DEFAULT: '#c8f31d', dark: '#9fc20f' } }
        }
      }
    };
  </script>
  <style>
    :root { --safe-b: env(safe-area-inset-bottom, 0px); --safe-t: env(safe-area-inset-top, 0px); }
    html, body { -webkit-tap-highlight-color: transparent; overscroll-behavior-y: contain; }
    body { padding-top: var(--safe-t); }
    .pb-nav { padding-bottom: calc(96px + var(--safe-b)); }
    .nav-safe { padding-bottom: calc(8px + var(--safe-b)); }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { scrollbar-width: none; }
    .sheet { transform: translateY(100%); transition: transform .28s cubic-bezier(.2,.8,.2,1); }
    .sheet.open { transform: translateY(0); }
    .backdrop { opacity: 0; transition: opacity .2s; pointer-events: none; }
    .backdrop.open { opacity: 1; pointer-events: auto; }
    .press { transition: transform .12s; }
    .press:active { transform: scale(.97); }
    input, select, textarea { font-size: 16px !important; } /* évite le zoom auto sur iOS */
    input[type="date"], input[type="time"] { min-height: 44px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .spin { animation: spin 1s linear infinite; }
  </style>
</head>
<body class="bg-zinc-50 text-zinc-900 dark:bg-zinc-950 dark:text-zinc-100 antialiased min-h-screen">

  <main id="view" class="mx-auto max-w-xl px-4 pt-4 pb-nav"></main>

  <!-- Barre de navigation (zone du pouce) -->
  <nav class="fixed inset-x-0 bottom-0 z-30 border-t border-zinc-200 bg-white/90 backdrop-blur dark:border-zinc-800 dark:bg-zinc-950/90 nav-safe">
    <div class="mx-auto grid max-w-xl grid-cols-5 items-end px-2 pt-2">
      <button data-nav="list" class="nav-btn flex flex-col items-center gap-1 py-1 text-[11px] font-medium">
        <svg class="h-6 w-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" d="M4 6h16M4 12h16M4 18h10"/></svg>À venir
      </button>
      <button data-nav="cal" class="nav-btn flex flex-col items-center gap-1 py-1 text-[11px] font-medium">
        <svg class="h-6 w-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="3"/><path stroke-linecap="round" d="M3 10h18M8 3v4M16 3v4"/></svg>Calendrier
      </button>
      <div class="flex justify-center">
        <button data-action="new" aria-label="Ajouter" class="press -mt-6 flex h-14 w-14 items-center justify-center rounded-2xl bg-ball text-zinc-950 shadow-lg shadow-ball/30">
          <svg class="h-7 w-7" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" d="M12 5v14M5 12h14"/></svg>
        </button>
      </div>
      <button data-nav="sync" class="nav-btn flex flex-col items-center gap-1 py-1 text-[11px] font-medium">
        <svg class="h-6 w-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 4v6h6M20 20v-6h-6M5.5 15a7 7 0 0 0 12.6 2M18.5 9A7 7 0 0 0 5.9 7"/></svg>Sync
      </button>
      <button data-nav="settings" class="nav-btn flex flex-col items-center gap-1 py-1 text-[11px] font-medium">
        <svg class="h-6 w-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path stroke-linecap="round" d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1 7 17M17 7l2.1-2.1"/></svg>Réglages
      </button>
    </div>
  </nav>

  <!-- Bottom sheet (détail / formulaire) -->
  <div id="backdrop" class="backdrop fixed inset-0 z-40 bg-black/50" data-action="close"></div>
  <section id="sheet" role="dialog" aria-modal="true"
    class="sheet fixed inset-x-0 bottom-0 z-50 mx-auto max-h-[92vh] max-w-xl overflow-y-auto rounded-t-3xl bg-white pb-[calc(24px+env(safe-area-inset-bottom))] shadow-2xl dark:bg-zinc-900">
    <div class="sticky top-0 z-10 flex justify-center bg-inherit pb-2 pt-3" data-action="close">
      <span class="h-1.5 w-10 rounded-full bg-zinc-300 dark:bg-zinc-700"></span>
    </div>
    <div id="sheet-body" class="px-5"></div>
  </section>

  <div id="toast" class="pointer-events-none fixed inset-x-0 bottom-28 z-[60] flex justify-center px-4 opacity-0 transition-opacity"></div>

  <script src="parser.js"></script>
  <script src="app.js"></script>
</body>
</html>
